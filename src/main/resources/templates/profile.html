<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Profile</title>

    <link href=
                  "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href=
                  "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f4f6f9;
        }

        .profile-card{
            max-width:800px;
            margin:auto;
            margin-top:50px;
            background:white;
            border-radius:20px;
            padding:40px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        .avatar{
            font-size:90px;
            color:#212529;
        }

        .stat-card{
            border-radius:15px;
            padding:20px;
            background:#f8f9fa;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="profile-card">

        <div class="text-center mb-4">

            <i class="bi bi-person-circle avatar"></i>

            <h2 th:text="${user.username}">
            </h2>

        </div>

        <div class="row g-4">

            <div class="col-md-4">

                <div class="stat-card text-center">

                    <h5>Total Expenses</h5>

                    <h3 class="text-primary">

                        ₹<span th:text="${totalExpense}">
                        </span>

                    </h3>

                </div>

            </div>

            <div class="col-md-4">

                <div class="stat-card text-center">

                    <h5>Transactions</h5>

                    <h3 class="text-success"
                        th:text="${totalTransactions}">
                    </h3>

                </div>

            </div>

            <div class="col-md-4">

                <div class="stat-card text-center">

                    <h5>Top Category</h5>

                    <h3 class="text-danger"
                        th:text="${topCategory}">
                    </h3>

                </div>

            </div>

        </div>

        <div class="mt-5 text-center">

            <a href="/expenses"
               class="btn btn-dark">

                Back To Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
