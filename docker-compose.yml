version: "3.8"

services:

  mysql:
    image: mysql:8.4
    container_name: expense-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: Sawsib@23923
      MYSQL_DATABASE: expense_tracker

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: biswas910/expense-tracker:latest
    container_name: expense-tracker
    restart: always

    depends_on:
      - mysql

    ports:
      - "8081:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/expense_tracker
      DB_USERNAME: root
      DB_PASSWORD: Sawsib@23923

volumes:
  mysql_data: